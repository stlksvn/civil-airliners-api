services:
  db:
    image: postgres:16-alpine
    container_name: avia_postgres
    environment:
      POSTGRES_USER: avia
      POSTGRES_PASSWORD: avia_password
      POSTGRES_DB: avia_metrics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avia -d avia_metrics"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monitoring_network
    restart: unless-stopped

  python-service:
    image: avia-api:stage-3
    build:
      context: .
    container_name: avia_fastapi_app
    env_file:
      - ./.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    networks:
      - monitoring_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_network
    depends_on:
      - python-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  monitoring_network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
