[project]
name = "avia-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sadeclipse", email = "nedoviziy2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
avia-api = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
